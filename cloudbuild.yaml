steps:
  # Build backend image (frontend is deployed separately to Firebase Hosting)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  # Push images
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'mejora-gemeseg-backend'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--port=8080'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:gemeseg-db'
      - '--set-env-vars=NODE_ENV=production,REDIS_HOST=,REDIS_PORT=6379'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,FRONTEND_URL=FRONTEND_URL:latest,BOLDSIGN_API_KEY=BOLDSIGN_API_KEY:latest,GOOGLE_SERVICE_ACCOUNT_JSON=GOOGLE_SERVICE_ACCOUNT_JSON:latest'

  # Build frontend. El intento anterior de desplegarlo vía GitHub Actions
  # (.github/workflows/firebase-hosting-merge.yml) fallaba porque requería un
  # secret FIREBASE_SERVICE_ACCOUNT que nunca se configuró en el repo.
  - name: 'node:20'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'node:20'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['run', 'build']
    env:
      - 'VITE_API_URL=https://mejora-gemeseg-backend-141953681725.us-central1.run.app/api'

  # Deploy frontend a Firebase Hosting con el builder oficial de Firebase
  # (mantenido por Google, no `npx firebase-tools` sobre `node:20`). Ese
  # builder SÍ recoge correctamente la identidad ambiental de la cuenta de
  # servicio de Cloud Build vía la Cloud Build Firebase integration; el
  # genérico `npx firebase-tools` sobre `node:20` no la detecta (probado:
  # 401 CREDENTIALS_MISSING), y un token personal `firebase login:ci`
  # (FIREBASE_TOKEN) resultó estar revocado/expirado (400 al refrescar el
  # token OAuth, visible solo con --debug). No hace falta ninguna clave ni
  # secreto: la cuenta de servicio de Cloud Build ya tiene los roles
  # Firebase Hosting Admin + Firebase Admin (este último incluye el permiso
  # de "API Keys Viewer" que pide la doc oficial de Cloud Build → Firebase:
  # https://cloud.google.com/build/docs/deploying-builds/deploy-firebase).
  # No crear una clave de service account para esto — la política de la
  # organización bloquea `iam.serviceAccountKeys.create` incluso para Owner.
  - name: 'us-docker.pkg.dev/firebase-cli/us/firebase'
    args: ['deploy', '--project=mejora-gemeseg', '--only=hosting']

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Fuerza el uso de la cuenta de servicio "legacy" de Cloud Build (la que
# tiene roles/firebase.admin + roles/firebasehosting.admin ya otorgados),
# en vez de la cuenta de servicio de Compute Engine que Google usa por
# defecto en proyectos nuevos y que no tiene esos roles — eso era lo que
# hacía fallar el paso de Firebase Hosting con 403 PERMISSION_DENIED.
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/141953681725@cloudbuild.gserviceaccount.com'

timeout: 1200s
