steps:
  # Build backend image (frontend is deployed separately to Firebase Hosting)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  # Push images
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'mejora-gemeseg-backend'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--port=8080'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:gemeseg-db'
      - '--set-env-vars=NODE_ENV=production,REDIS_HOST=,REDIS_PORT=6379'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,FRONTEND_URL=FRONTEND_URL:latest,BOLDSIGN_API_KEY=BOLDSIGN_API_KEY:latest'

  # Build frontend. El intento anterior de desplegarlo vía GitHub Actions
  # (.github/workflows/firebase-hosting-merge.yml) fallaba porque requería un
  # secret FIREBASE_SERVICE_ACCOUNT que nunca se configuró en el repo.
  - name: 'node:20'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['ci']

  - name: 'node:20'
    dir: 'frontend'
    entrypoint: 'npm'
    args: ['run', 'build']
    env:
      - 'VITE_API_URL=https://mejora-gemeseg-backend-141953681725.us-central1.run.app/api'

  # Deploy frontend a Firebase Hosting. `firebase-tools` no recoge de forma
  # confiable las credenciales ambientales de la cuenta de servicio de Cloud
  # Build (a diferencia de `gcloud`), así que se autentica con un token de CI
  # (`firebase login:ci`, generado una sola vez y guardado en Secret Manager
  # como FIREBASE_TOKEN) en vez de depender de IAM/ADC.
  - name: 'node:20'
    dir: 'frontend'
    entrypoint: 'npx'
    args: ['--yes', 'firebase-tools', 'deploy', '--only', 'hosting', '--project', 'mejora-gemeseg']
    secretEnv: ['FIREBASE_TOKEN']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_TOKEN/versions/latest
      env: 'FIREBASE_TOKEN'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
