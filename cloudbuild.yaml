steps:
  # Build backend+frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  # Push images
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'mejora-gemeseg-backend'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--port=8080'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:gemeseg-db'
      - '--set-env-vars=NODE_ENV=production,REDIS_HOST=,REDIS_PORT=6379'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,FRONTEND_URL=FRONTEND_URL:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: 600s
