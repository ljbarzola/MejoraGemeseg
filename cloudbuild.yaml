steps:
  # Build backend image (frontend is deployed separately to Firebase Hosting).
  # `waitFor: ['-']` arranca este paso y los del frontend a la vez (antes iban
  # en fila). BuildKit + caché en línea: la imagen `latest` guarda su caché y
  # el siguiente build reutiliza las capas del sistema (Chromium y LibreOffice)
  # cuando no cambian. La primera vez no hay caché y tarda como antes.
  # La etapa de compilación (npm ci, 90-100 s) se construye aparte y se guarda
  # como imagen `mejora-gemeseg-backend-builder:cache` solo para reutilizar su
  # caché; esa imagen NO se despliega. Con package*.json sin cambios, `npm ci`
  # sale de caché. En las pruebas, un despliegue con código cambiado bajó de
  # ~221 s a ~151 s en este tramo y la imagen final salió idéntica (mismas
  # versiones de Node, Chromium y LibreOffice, mismos paquetes y mismo peso).
  - id: 'build-builder'
    name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    waitFor: ['-']
    args:
      - 'build'
      - '--target'
      - 'backend-builder'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '--cache-from'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend-builder:cache'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend-builder:cache'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  # Guarda la caché de la etapa de compilación para el próximo build. Corre en
  # paralelo con el resto: nada depende de que termine.
  - id: 'push-builder-cache'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-builder']
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend-builder:cache'

  - id: 'build-backend'
    name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    waitFor: ['build-builder']
    args:
      - 'build'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '--cache-from'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend:latest'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  # Push images
  - id: 'push-backend'
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build-backend']
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend'

  # Deploy to Cloud Run
  - id: 'deploy-backend'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['push-backend']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'mejora-gemeseg-backend'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/gemeseg-repo/mejora-gemeseg-backend:$BUILD_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--memory=512Mi'
      - '--cpu=1'
      # CPU extra solo mientras arranca el contenedor (y 10 s después); acorta
      # el arranque en frío. Ya estaba activo en el servicio; se deja explícito
      # para que no se pierda en un redeploy. Se factura solo ese tramo.
      - '--cpu-boost'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--port=8080'
      - '--add-cloudsql-instances=$PROJECT_ID:us-central1:gemeseg-db'
      # GOOGLE_VERTEX_* habilita el análisis de PDFs de Reclutamiento. Sin
      # GOOGLE_VERTEX_PROJECT el servicio responde "no está configurado".
      # El proyecto es agentes-504115 (la service account de Drive), no
      # mejora-gemeseg. Todas tienen que estar AQUÍ: --set-env-vars
      # reemplaza todas las variables planas, así que ponerlas a mano en la
      # consola de Cloud Run se pierde en el deploy siguiente.
      # Gemini 2.5 se retira el 2026-10-20. Los modelos 3.x solo responden por
      # el endpoint `global` (en us-central1 dan 404): FUERTE = documentos
      # escaneados de RRHH (y el Agente de Ventas cuando se una a main); LIGERO = Agente Gemeseg y extracción de
      # fechas (ver .agents/modules/agents-ai.md punto 4).
      # GOOGLE_WORKSPACE_ADMIN_EMAIL: administrador de Workspace que se impersona para
      # leer los informes de inicio de sesión y Drive de la Bitácora del equipo (solo
      # lectura, con la cuenta de CORREO y su permiso admin.reports.audit.readonly; ver
      # AGENTS.md, «Bitácora del equipo»). Sin ella, «Leer Google ahora» y el job horario
      # responden con un mensaje claro y no leen nada.
      - '--set-env-vars=NODE_ENV=production,REDIS_HOST=,REDIS_PORT=6379,GOOGLE_VERTEX_PROJECT=agentes-504115,GOOGLE_VERTEX_LOCATION=global,GOOGLE_VERTEX_MODEL_FUERTE=gemini-3.8-flash,GOOGLE_VERTEX_MODEL_LIGERO=gemini-3.5-flash-lite,GOOGLE_WORKSPACE_ADMIN_EMAIL=sistemas@gemeseg.com,MEJORA_CONTINUA_CORREO=sistemas@gemeseg.com'
      # Bot de WhatsApp (2026-11-17): token de Meta, secreto de la app y token de verificación del webhook.
      # Los tres secretos DEBEN existir en Secret Manager (y tener acceso la cuenta de Cloud Run) ANTES de
      # fusionar este cambio, o todo el despliegue del backend falla.
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,FRONTEND_URL=FRONTEND_URL:latest,SIGNWELL_API_KEY=SIGNWELL_API_KEY:latest,GOOGLE_SERVICE_ACCOUNT_JSON=GOOGLE_SERVICE_ACCOUNT_JSON:latest,GMAIL_SERVICE_ACCOUNT_JSON=GMAIL_SERVICE_ACCOUNT_JSON:latest,CRON_SECRET=CRON_SECRET:latest,MEJORA_CONTINUA_KEY=MEJORA_CONTINUA_KEY:latest,MEJORA_CONTINUA_DECISION_KEY=MEJORA_CONTINUA_DECISION_KEY:latest,WHATSAPP_ACCESS_TOKEN=WHATSAPP_ACCESS_TOKEN:latest,WHATSAPP_APP_SECRET=WHATSAPP_APP_SECRET:latest,WHATSAPP_VERIFY_TOKEN=WHATSAPP_VERIFY_TOKEN:latest'

  # Build frontend. El intento anterior de desplegarlo vía GitHub Actions
  # (.github/workflows/firebase-hosting-merge.yml) fallaba porque requería un
  # secret FIREBASE_SERVICE_ACCOUNT que nunca se configuró en el repo.
  # El frontend se instala y compila EN PARALELO con la imagen del backend
  # (`waitFor: ['-']`); solo el despliegue a Hosting espera a Cloud Run, así el
  # orden de salida sigue siendo backend primero y frontend después.
  - id: 'frontend-install'
    name: 'node:20'
    dir: 'frontend'
    entrypoint: 'npm'
    waitFor: ['-']
    args: ['ci']

  - id: 'frontend-build'
    name: 'node:20'
    dir: 'frontend'
    entrypoint: 'npm'
    waitFor: ['frontend-install']
    args: ['run', 'build']
    env:
      - 'VITE_API_URL=https://mejora-gemeseg-backend-141953681725.us-central1.run.app/api'

  # Deploy frontend a Firebase Hosting con el builder oficial de Firebase
  # (mantenido por Google, no `npx firebase-tools` sobre `node:20`). Ese
  # builder SÍ recoge correctamente la identidad ambiental de la cuenta de
  # servicio de Cloud Build vía la Cloud Build Firebase integration; el
  # genérico `npx firebase-tools` sobre `node:20` no la detecta (probado:
  # 401 CREDENTIALS_MISSING), y un token personal `firebase login:ci`
  # (FIREBASE_TOKEN) resultó estar revocado/expirado (400 al refrescar el
  # token OAuth, visible solo con --debug). No hace falta ninguna clave ni
  # secreto: la cuenta de servicio de Cloud Build ya tiene los roles
  # Firebase Hosting Admin + Firebase Admin (este último incluye el permiso
  # de "API Keys Viewer" que pide la doc oficial de Cloud Build → Firebase:
  # https://cloud.google.com/build/docs/deploying-builds/deploy-firebase).
  # No crear una clave de service account para esto — la política de la
  # organización bloquea `iam.serviceAccountKeys.create` incluso para Owner.
  - id: 'deploy-hosting'
    name: 'us-docker.pkg.dev/firebase-cli/us/firebase'
    waitFor: ['deploy-backend', 'frontend-build']
    args: ['deploy', '--project=mejora-gemeseg', '--only=hosting']

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Fuerza el uso de una service account propia (cloudbuild-deploy), con los
# mismos roles que antes tenía la cuenta "legacy" de Cloud Build
# (roles/firebase.admin + roles/firebasehosting.admin incluidos), en vez de
# la cuenta de servicio de Compute Engine que Google usa por defecto en
# proyectos nuevos y que no tiene esos roles — eso hacía fallar el paso de
# Firebase Hosting con 403 PERMISSION_DENIED. La cuenta "legacy"
# (@cloudbuild.gserviceaccount.com) ya no se puede referenciar aquí: Google
# exige una service account "user-managed" o dejar este campo vacío.
serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/cloudbuild-deploy@mejora-gemeseg.iam.gserviceaccount.com'

timeout: 1200s
