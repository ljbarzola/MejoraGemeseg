name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: mejora-gemeseg
  GCP_REGION: us-central1
  BACKEND_URL: https://mejora-gemeseg-backend-141953681725.us-central1.run.app
  VITE_API_URL: https://mejora-gemeseg-backend-141953681725.us-central1.run.app/api

jobs:
  deploy:
    name: Build, deploy backend + frontend
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.gemeseg.com/dashboard
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Avisar si hay migraciones nuevas sin aplicar
        run: |
          NEW=$(git diff --name-only HEAD^ HEAD -- backend/prisma/migrations \
            | grep -v migration_lock.toml || true)
          if [ -n "$NEW" ]; then
            {
              echo "### ⚠️ Migraciones nuevas en este deploy"
              echo "No se aplican automaticamente. Corre esto contra Cloud SQL antes de que se usen los endpoints nuevos:"
              echo '```'
              echo "$NEW"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Autenticar con Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Backend -> Cloud Run (reusa cloudbuild.yaml)
        run: gcloud builds submit --config=cloudbuild.yaml --project="${{ env.GCP_PROJECT_ID }}" .

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar frontend
        working-directory: frontend
        run: npm ci && npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Frontend -> Firebase Hosting (app.gemeseg.com)
        run: npx --yes firebase-tools@13 deploy --only hosting --project "${{ env.GCP_PROJECT_ID }}" --non-interactive

      - name: Smoke test - backend /health
        run: curl -sf "${{ env.BACKEND_URL }}/health" | grep -q '"status":"ok"'

      - name: Smoke test - dominio de produccion
        run: curl -sSf -o /dev/null "https://app.gemeseg.com/" || echo "::warning::app.gemeseg.com no respondio 2xx, revisar manualmente"
