<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>GEMESEG Admin</title>
  </head>
  <body>
    <!-- Calentamiento: despierta el backend (Cloud Run lo apaga tras un rato sin
         uso) en cuanto se abre la página, sin esperar a que React cargue y a que
         la persona termine de escribir su clave. Es el mismo origen (Hosting
         reescribe /health al backend), así que no hay CORS ni preflight; si
         falla se ignora. En desarrollo local se omite. -->
    <script>
      if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        fetch('/health', { cache: 'no-store', credentials: 'omit' }).catch(function () {});
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
